# /etc/nginx/sites-available/aib2b.local.conf
#
# The satire site (SIXSEVEN). HTTP only, local dev.
#
# Unlike laflau there is no Next.js upstream here — everything is Laravel on
# php8.4-fpm, so `location /` goes straight to index.php:
#
#   Frontend  ->  /            (EN)  and  /uk/...   (UK)   routes/web.php
#   Backpack  ->  /admin       (route_prefix in config/backpack/base.php)
#
# Static site assets came from the original markup and are served off disk:
#   /assets/   site.css + app.js
#   /_ds/      Nocturne design-system token sheet
#   /uploads/  images from the markup
#
# Tailwind/Alpine/jQuery load from CDNs, so there is no build step and no
# Vite dev server to proxy.

server {
    listen 80;
    listen [::]:80;
    server_name aib2b.local www.aib2b.local;

    set $root_path /srv/www/petprojects/aidrivenb2bsaas67gptwrapperstartup/public;
    root $root_path;

    index index.php;

    charset utf-8;

    # Backpack PRO upload fields; the markup images are ~130K each.
    client_max_body_size 64M;

    # Production terminates TLS behind a proxy that serves brotli; this keeps
    # local measurements in the same ballpark instead of shipping the bundles
    # uncompressed and making every page-weight number look three times worse.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    access_log /var/log/nginx/aib2b.local.access.log;
    error_log  /var/log/nginx/aib2b.local.error.log;

    # ------------------------------------------------------------- static
    # `^~` on these three: they beat the extension regex below and, more to
    # the point, stop a stray request from ever reaching PHP.
    # The bundles are cache-busted by asset_v() (?v=<mtime>), so the bytes at a
    # given URL never change — a year and immutable is correct, and it is what
    # Lighthouse's cache-policy audit wants. Fonts are versioned in the filename.
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }
    location ^~ /_ds/     { access_log off; expires 7d; try_files $uri =404; }
    location ^~ /uploads/ { access_log off; expires 30d; try_files $uri =404; }

    # public/storage -> storage/app/public. Backpack's basset cache lands
    # here too (JS/CSS for the admin panel), so it must be served, not 404'd.
    location ^~ /storage/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(webmanifest|csv|xml|jpg|jpeg|js|gif|png|css|zip|tgz|gz|rar|bz2|doc|xls|pdf|ppt|odt|mp3|mp4|wav|webm|bmp|swf|ico|txt|docx|xlsx|svg|map|webp)$ {
        root $root_path;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.(eot|ttf|woff|woff2)$ {
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ------------------------------------------------------------- laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Backpack list views with many columns can outrun the 60s default.
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
